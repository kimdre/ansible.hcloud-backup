---
- name: Validate backup type
  ansible.builtin.assert:
    quiet: true
    that:
      - backup_type in ["snapshot", "backup"]
    fail_msg: "Backup type must be either 'snapshot' or 'backup'."

- name: Validate API token
  no_log: true
  ansible.builtin.assert:
    quiet: true
    that:
      - api_token is defined
      - api_token is string
      - api_token | trim | length > 0
    fail_msg: "Variable api_token must be a nonempty string."

- name: Validate server ID
  ansible.builtin.assert:
    quiet: true
    that:
      - id is defined
      - >-
        (id is integer and id is not boolean) or
        (id is string and id is regex('[1-9][0-9]*', match_type='fullmatch'))
      - id | int > 0
    fail_msg: "Host variable id must be a positive Hetzner Cloud server ID."

- name: Validate backup description
  ansible.builtin.assert:
    quiet: true
    that:
      - backup_description is string
    fail_msg: "Variable backup_description must be a string."

- name: Validate snapshot rotation flag
  ansible.builtin.assert:
    quiet: true
    that:
      - rotate_snapshots is boolean
    fail_msg: "Variable rotate_snapshots must be a boolean."

- name: Validate number of snapshots to keep
  when: backup_type == "snapshot" and rotate_snapshots
  ansible.builtin.assert:
    quiet: true
    that:
      - keep_snapshots is integer
      - keep_snapshots is not boolean
      - keep_snapshots >= 1
      - keep_snapshots <= 40
    fail_msg: "Number of snapshots to keep must be an integer between 1 and 40."

- name: Validate retries and delay
  ansible.builtin.assert:
    quiet: true
    that:
      - backup_check_retries is integer
      - backup_check_retries is not boolean
      - backup_check_retries >= 0
      - backup_check_delay is integer
      - backup_check_delay is not boolean
      - backup_check_delay >= 0
    fail_msg: "Retries and delay must be nonnegative integers."

- name: Validate backup labels dictionary
  ansible.builtin.assert:
    quiet: true
    that:
      - backup_labels is mapping
    fail_msg: "Variable backup_labels must be a dictionary."

- name: Validate backup labels
  loop: "{{ backup_labels | dict2items }}"
  vars:
    # Name: 1 to 63 characters. Starts and ends with a letter or digit.
    hcloud_backup_label_name: '[a-zA-Z0-9]([a-zA-Z0-9_.-]{0,61}[a-zA-Z0-9])?'
    # Optional key prefix: DNS subdomain of 253 characters or less, then a slash.
    hcloud_backup_label_prefix: >-
      (?=[^/]{1,253}/)[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*/
  ansible.builtin.assert:
    quiet: true
    that:
      - item.key is string
      - item.value is string
      - item.key is regex('(' ~ hcloud_backup_label_prefix ~ ')?' ~ hcloud_backup_label_name, match_type='fullmatch')
      - item.value == "" or item.value is regex(hcloud_backup_label_name, match_type='fullmatch')
      - not item.key.lower().startswith('hetzner.cloud/')
    fail_msg: >-
      Labels must follow the Hetzner Cloud label rules. Names and values have 63 characters or less,
      start and end with a letter or digit, and use only letters, digits, underscores, dots or hyphens.
      Values can be empty. Keys can have a DNS subdomain prefix with a slash. The 'hetzner.cloud/' prefix is reserved.

- name: Validate snapshot label selectors
  when: backup_type == "snapshot" and rotate_snapshots
  block:
    - name: Validate label selector dictionary
      ansible.builtin.assert:
        quiet: true
        that:
          - label_selector is mapping
          - label_selector | length > 0
        fail_msg: "Variable label_selector must be a nonempty dictionary when snapshot rotation is enabled."

    - name: Validate selectors match backup labels
      loop: "{{ label_selector | dict2items }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - item.key in backup_labels
          - item.value == backup_labels[item.key]
          - item.value | length > 0
        fail_msg: >-
          Each label selector must match a backup label, including its value.
          Selector values cannot be empty because the API does not document 'key=' for empty values.

- name: Check if backups are enabled on server
  when: backup_type == "backup" and not ansible_check_mode
  block:
    - name: Get server details
      delegate_to: "{{ delegation }}"
      register: hcloud_backup_server
      no_log: true
      ansible.builtin.uri:
        url: "https://api.hetzner.cloud/v1/servers/{{ id | int }}"
        method: GET
        status_code: 200
        headers:
          Authorization: "Bearer {{ api_token }}"

    - name: Check if backups are enabled
      ansible.builtin.assert:
        quiet: true
        that:
          - hcloud_backup_server.json.server.backup_window not in [none, ""]
        fail_msg: "Backups are not enabled on this server."
