---
- name: Create {{ backup_type }}
  delegate_to: "{{ delegation }}"
  register: hcloud_backup_created_image
  no_log: true
  changed_when: hcloud_backup_created_image is succeeded
  ansible.builtin.uri:
    url: "https://api.hetzner.cloud/v1/servers/{{ id | int }}/actions/create_image"
    method: POST
    headers:
      Authorization: "Bearer {{ api_token }}"
    body:
      description: "{{ backup_description }}"
      labels: "{{ backup_labels }}"
      type: "{{ backup_type }}"
    status_code: 201
    body_format: json

- name: Wait until {{ backup_type }} is finished with interval {{ backup_check_delay }}s
  delegate_to: "{{ delegation }}"
  register: hcloud_backup_action
  no_log: true
  ansible.builtin.uri:
    url: "https://api.hetzner.cloud/v1/actions/{{ hcloud_backup_created_image.json.action.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token }}"
    status_code: 200
  # Ansible marks the result as failed when all retries are used, even with failed_when.
  # The next tasks check the result and give a clear error message for each failure type.
  ignore_errors: true
  until: >-
    hcloud_backup_action is failed
    or (hcloud_backup_action.json.action.status | default('')) != "running"
  retries: "{{ backup_check_retries }}"
  delay: "{{ backup_check_delay }}"

- name: Check the {{ backup_type }} status response
  when: hcloud_backup_action.json.action.status is not defined
  no_log: true
  vars:
    hcloud_backup_status_error: >-
      {{ hcloud_backup_action.json.error.message
      | default('The response has no action status.' if (hcloud_backup_action.status | default(0)) == 200
      else hcloud_backup_action.msg | default('The request did not complete.')) }}
  ansible.builtin.fail:
    msg: >-
      The {{ backup_type }} status check failed (HTTP {{ hcloud_backup_action.status | default('unknown') }}):
      {{ hcloud_backup_status_error | replace(api_token, '[redacted]') }}

- name: Check that {{ backup_type }} creation finished in time
  when: hcloud_backup_action.json.action.status == "running"
  no_log: true
  ansible.builtin.fail:
    msg: >-
      The {{ backup_type }} is still running after {{ backup_check_retries + 1 }} status checks
      in about {{ backup_check_retries * backup_check_delay }} seconds
      (progress {{ hcloud_backup_action.json.action.progress | default('unknown') }}%).
      Hetzner Cloud can still finish the {{ backup_type }}, but the role stopped and did not run the remaining steps.
      Increase backup_check_retries or backup_check_delay to wait longer.

- name: Check that {{ backup_type }} creation succeeded
  when: hcloud_backup_action.json.action.status != "success"
  no_log: true
  ansible.builtin.fail:
    msg: >-
      The {{ backup_type }} creation failed with action status '{{ hcloud_backup_action.json.action.status }}':
      {{ (hcloud_backup_action.json.action.error.message | default('No error message.'))
      | replace(api_token, '[redacted]') }}
